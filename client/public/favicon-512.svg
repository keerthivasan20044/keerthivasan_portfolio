<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070f"/>
      <stop offset="100%" style="stop-color:#0d0d24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg2)"/>

  <!-- Inner glow -->
  <rect width="512" height="512" rx="100" fill="url(#glow)"/>

  <!-- Border gradient -->
  <rect x="4" y="4" width="504" height="504" rx="98" fill="none"
        stroke="url(#bg2)" stroke-width="0"/>

  <!-- Top cyan line -->
  <rect x="0" y="0" width="512" height="6" rx="3" fill="#00f5ff" opacity="0.8"/>

  <!-- Cyan glow behind K -->
  <ellipse cx="175" cy="265" rx="95" ry="80" fill="#00f5ff" opacity="0.06"/>

  <!-- Pink glow behind V -->
  <ellipse cx="340" cy="265" rx="95" ry="80" fill="#ff006e" opacity="0.06"/>

  <!-- K letter - thick bold -->
  <text x="62" y="360"
        font-family="Arial Black, Arial"
        font-weight="900"
        font-size="280"
        fill="#00f5ff"
        filter="url(#ks)">K</text>

  <!-- V letter -->
  <text x="248" y="360"
        font-family="Arial Black, Arial"
        font-weight="900"
        font-size="280"
        fill="#ff006e">V</text>

  <!-- Dot top right -->
  <circle cx="458" cy="72" r="22" fill="#9d4edd" opacity="0.9"/>
  <circle cx="458" cy="72" r="14" fill="#9d4edd"/>

  <!-- Bottom accent line -->
  <rect x="140" y="400" width="232" height="4" rx="2" fill="url(#bg2)" opacity="0"/>
  <line x1="140" y1="402" x2="372" y2="402" stroke="#00f5ff" stroke-width="3" opacity="0.4"/>
</svg>