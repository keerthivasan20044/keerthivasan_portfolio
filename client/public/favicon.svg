<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a18"/>
      <stop offset="100%" style="stop-color:#0d0d24"/>
    </linearGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#9d4edd"/>
      <stop offset="100%" style="stop-color:#ff006e"/>
    </linearGradient>
  </defs>

  <!-- Rounded square bg -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Gradient border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="url(#border_grad)" stroke-width="1.5"/>

  <!-- K letter -->
  <text x="4" y="23" font-family="Arial" font-weight="900" font-size="17" fill="#00f5ff">K</text>

  <!-- V letter -->
  <text x="16" y="23" font-family="Arial" font-weight="900" font-size="17" fill="#ff006e">V</text>

  <!-- Dot accent -->
  <circle cx="28" cy="6" r="2" fill="#9d4edd" opacity="0.8"/>
</svg>